# Nightly full regression + performance + published report — see docs/CI-CD.md.
name: Nightly Regression

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

# Pages allows one deployment at a time. Cancelling an in-flight nightly deploy would be worse
# than queueing behind it, so this waits rather than cancels.
concurrency:
  group: nightly-pages
  cancel-in-progress: false

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    # The only nightly job that had no ceiling, which stopped being theoretical on run
    # 30478659456: `playwright install` stalled on the firefox shard and the job sat there while
    # every other job had finished. Without this it can hold the runner for GitHub's 6 hour
    # default and block the report job behind it. Observed 90-120s per browser.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # The `setup` project (auth storageState) has no browser configured, so it runs on
      # chromium for every shard — install it alongside the matrix browser or firefox/webkit
      # fail in setup before any test runs. Duplicate args are deduped by Playwright.
      - run: npx playwright install --with-deps chromium ${{ matrix.browser }}
      - run: bash scripts/sut-up.sh
      - run: npx playwright test tests/ui --project=${{ matrix.browser }}
        env: { PW_JSON_REPORT: test-results/ui-report.json }
      # Nightly is where cross-browser races surface, so the zero-flaky budget is enforced here
      # too. A test that cannot be fixed right now goes to quarantine, not back into hiding.
      - run: node scripts/check-flake.mjs test-results/ui-report.json
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.browser }}
          path: test-results/
      # Uploaded even when the run is red — a report that only exists for green runs is useless
      # exactly when someone needs it.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/

  # The API layer otherwise only runs against PRs. docs/CI-CD.md and docs/REPORTING.md both
  # describe nightly as covering it, and the published report aggregates UI + API.
  full-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: bash scripts/sut-up.sh
      - run: npm run test:api
        env: { PW_JSON_REPORT: test-results/api-report.json }
      - run: node scripts/check-flake.mjs test-results/api-report.json
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-api
          path: allure-results/

  # Nightly rather than the PR gate, deliberately. Toolshop's accessibility state is inherited, so
  # the first scans may well be red; blocking every pull request on a third-party application's
  # markup would stop the project rather than improve it. Promote to the PR gate once the findings
  # are documented and the budget holds — see ADR-003.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/sut-up.sh
      - run: npx playwright test --project=a11y
        env: { PW_JSON_REPORT: test-results/a11y-report.json }
      - run: node scripts/check-flake.mjs test-results/a11y-report.json
        if: always()
      # Traces and screenshots, without which a failure here can only be read from the log. The
      # first run of this job timed out on a cart race and the trace would have said so directly.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-a11y
          path: test-results/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-a11y
          path: allure-results/

  # Chromium only and nightly only, per ADR-004. A rendering difference should open an
  # investigation, not block an unrelated pull request. Baselines come from the Visual Baselines
  # workflow — this job only compares against what is committed.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/sut-up.sh
      - run: npx playwright test --project=visual
        env: { PW_JSON_REPORT: test-results/visual-report.json }
      - run: node scripts/check-flake.mjs test-results/visual-report.json
        if: always()
      # Carries the diff images, which are the only way to judge whether a failure is a real
      # regression or noise that wants a tolerance conversation.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-visual
          path: test-results/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-visual
          path: allure-results/

  # Quarantined tests still run, so "parked" never quietly becomes "deleted". Non-blocking by
  # design: these are known-unreliable, and the signal wanted here is whether they have healed.
  quarantine:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/sut-up.sh
      # --pass-with-no-tests: an empty quarantine is the healthy steady state, not a failure.
      - run: npx playwright test --project=quarantine-api --project=quarantine-ui --pass-with-no-tests
      # Feeding these into the published report is what makes quarantine visible instead of a
      # place tests disappear into.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-quarantine
          path: allure-results/

  perf:
    runs-on: ubuntu-latest
    # Two 3.5 min load profiles plus a smoke and the SUT boot — about 9 min. A hang guard, since
    # nightly has no gate budget of its own.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: grafana/setup-k6-action@v1
      - run: bash scripts/sut-up.sh
      # Load profiles for the read paths; checkout stays a smoke because a load profile there
      # writes hundreds of orders into the database whose latency is being measured
      # (docs/TEST-STRATEGY.md §3a).
      #
      # `if: always()` on the later steps because nightly exists to observe. Without it the first
      # breached budget aborts the job and the remaining journeys report nothing — which is exactly
      # what happened on run 30452593269, where a login breach hid search and checkout entirely.
      # The job still fails; it just fails with the full picture.
      - run: k6 run tests/performance/login.load.js
      - run: k6 run tests/performance/search.load.js
        if: always()
      - run: k6 run tests/performance/checkout.smoke.js
        if: always()

  # Merge every suite's results into one Allure report and publish it. `if: always()` because a
  # red nightly is precisely when the report is worth reading.
  report:
    needs: [full-e2e, full-api, a11y, visual, quarantine]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
      # Reading the previous run's published-site artifact. Without this the token has no Actions
      # scope at all, since naming any permission drops the rest to none.
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      # allure-commandline is a Java program. The runner image ships a JDK, but that is an
      # implicit dependency — the nightly has already been broken once by assuming a tool was
      # present, so pin it explicitly.
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci

      # merge-multiple flattens every allure-results-* artifact into one directory. Safe because
      # allure result files are uuid-named, so shards cannot collide.
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # `setup` is a fixture that mints storageState, not a test, and it runs once per job that
      # needs auth. Four identical executions share a historyId, so Allure folds them into a
      # single entry with three retries — a retry badge in the very report meant to make
      # instability visible. A real setup failure still shows up loudly, as every test in that
      # job failing. The script selects by Playwright project label rather than by file path, and
      # fails if it matches nothing, so a silent no-op cannot pass for a fix.
      - name: Drop auth-setup results
        run: node scripts/drop-auth-setup-results.mjs allure-results

      # No `enablement: true` here: creating a Pages site needs admin rights that the default
      # GITHUB_TOKEN does not have, so it fails with "Resource not accessible by integration"
      # rather than self-healing. Pages is enabled once per repo instead — see docs/CI-CD.md.
      - uses: actions/configure-pages@v6
        id: pages

      # Trend charts need the previous report's history folder. It lives on the already-published
      # site, so pull it back from there; the first ever run 404s and simply starts a fresh trend.
      - name: Restore Allure history
        run: |
          mkdir -p allure-results/history
          base="${{ steps.pages.outputs.base_url }}"
          for f in history.json history-trend.json retry-trend.json categories-trend.json duration-trend.json; do
            if curl -sfL "$base/history/$f" -o "allure-results/history/$f"; then
              echo "restored $f"
            else
              echo "no previous $f (first run or trimmed)"
            fi
          done

      # Makes each point on the trend chart link back to the report that produced it. Allure copies
      # only `reportUrl` into history-trend.json — `buildUrl` never survives into history — so this
      # has to name the run's own report directory, not the site root, or an old point would open
      # whichever report happens to be published now. `buildUrl` still reaches the run itself from
      # the Executors widget.
      - name: Write Allure executor metadata
        run: |
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${{ github.run_number }},
            "buildName": "nightly #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "${{ steps.pages.outputs.base_url }}/runs/${{ github.run_number }}"
          }
          EOF

      - run: npx allure generate allure-results --clean -o allure-report

      # A Pages deploy replaces the entire site, so the previous one has to be carried forward or
      # every historical report disappears the moment the next nightly publishes. It travels as a
      # workflow artifact rather than a gh-pages branch, keeping the nightly out of the repo's
      # commit history. A missing artifact is not fatal: retention expires, and the very first run
      # has nothing to restore — the site simply starts over with this run's report.
      - name: Restore the previously published site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh run list --workflow=nightly.yml --branch=main --status=success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$previous" ]; then
            echo "no earlier successful nightly — starting a fresh site"
          elif gh run download "$previous" --name published-site --dir site; then
            echo "restored the site published by run $previous"
          else
            echo "run $previous published no site artifact — starting a fresh site"
          fi

      # --keep bounds the site: past that, the oldest reports fall off and their trend points go
      # stale. Twenty nights is roughly three weeks of history, which is longer than any flake
      # investigation here has needed.
      - name: Assemble the site
        run: |
          node scripts/assemble-report-site.mjs \
            --report allure-report \
            --site site \
            --run ${{ github.run_number }} \
            --keep 20

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # Feeds the next nightly's restore step. Without it the chain breaks and the site resets to
      # a single report.
      - uses: actions/upload-artifact@v7
        with:
          name: published-site
          path: site
      - uses: actions/deploy-pages@v5
        id: deploy
