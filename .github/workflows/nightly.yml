# Nightly full regression + performance + published report — see docs/CI-CD.md.
name: Nightly Regression

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

# Pages allows one deployment at a time. Cancelling an in-flight nightly deploy would be worse
# than queueing behind it, so this waits rather than cancels.
concurrency:
  group: nightly-pages
  cancel-in-progress: false

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # The `setup` project (auth storageState) has no browser configured, so it runs on
      # chromium for every shard — install it alongside the matrix browser or firefox/webkit
      # fail in setup before any test runs. Duplicate args are deduped by Playwright.
      - run: npx playwright install --with-deps chromium ${{ matrix.browser }}
      - run: bash scripts/sut-up.sh
      - run: npx playwright test tests/ui --project=${{ matrix.browser }}
        env: { PW_JSON_REPORT: test-results/ui-report.json }
      # Nightly is where cross-browser races surface, so the zero-flaky budget is enforced here
      # too. A test that cannot be fixed right now goes to quarantine, not back into hiding.
      - run: node scripts/check-flake.mjs test-results/ui-report.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.browser }}
          path: test-results/
      # Uploaded even when the run is red — a report that only exists for green runs is useless
      # exactly when someone needs it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/

  # The API layer otherwise only runs against PRs. docs/CI-CD.md and docs/REPORTING.md both
  # describe nightly as covering it, and the published report aggregates UI + API.
  full-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: bash scripts/sut-up.sh
      - run: npm run test:api
        env: { PW_JSON_REPORT: test-results/api-report.json }
      - run: node scripts/check-flake.mjs test-results/api-report.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: allure-results/

  # Quarantined tests still run, so "parked" never quietly becomes "deleted". Non-blocking by
  # design: these are known-unreliable, and the signal wanted here is whether they have healed.
  quarantine:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/sut-up.sh
      # --pass-with-no-tests: an empty quarantine is the healthy steady state, not a failure.
      - run: npx playwright test --project=quarantine-api --project=quarantine-ui --pass-with-no-tests
      # Feeding these into the published report is what makes quarantine visible instead of a
      # place tests disappear into.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-quarantine
          path: allure-results/

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: bash scripts/sut-up.sh
      - run: k6 run tests/performance/login.smoke.js
      # TODO(M4): swap smoke for load profiles with p95 thresholds

  # Merge every suite's results into one Allure report and publish it. `if: always()` because a
  # red nightly is precisely when the report is worth reading.
  report:
    needs: [full-e2e, full-api, quarantine]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      # allure-commandline is a Java program. The runner image ships a JDK, but that is an
      # implicit dependency — the nightly has already been broken once by assuming a tool was
      # present, so pin it explicitly.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci

      # merge-multiple flattens every allure-results-* artifact into one directory. Safe because
      # allure result files are uuid-named, so shards cannot collide.
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      # Trend charts need the previous report's history folder. It lives on the already-published
      # site, so pull it back from there; the first ever run 404s and simply starts a fresh trend.
      - name: Restore Allure history
        run: |
          mkdir -p allure-results/history
          base="${{ steps.pages.outputs.base_url }}"
          for f in history.json history-trend.json retry-trend.json categories-trend.json duration-trend.json; do
            if curl -sfL "$base/history/$f" -o "allure-results/history/$f"; then
              echo "restored $f"
            else
              echo "no previous $f (first run or trimmed)"
            fi
          done

      # Makes each point on the trend chart link back to the run that produced it.
      - name: Write Allure executor metadata
        run: |
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${{ github.run_number }},
            "buildName": "nightly #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "${{ steps.pages.outputs.base_url }}"
          }
          EOF

      - run: npx allure generate allure-results --clean -o allure-report
      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
      - uses: actions/deploy-pages@v4
        id: deploy
