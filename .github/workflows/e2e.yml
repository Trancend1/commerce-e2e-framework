# PR quality gate — see docs/CI-CD.md. Required status check on main.
name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    # Budget: lint + smoke run in sequence and must stay under the 10 min PR-gate
    # budget (docs/TEST-STRATEGY.md). Observed 13-19s, so this is a hang guard.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      # Policy check only — lists tests, never boots the SUT, so it belongs in the cheap job.
      - run: node scripts/check-quarantine.mjs

  smoke:
    needs: lint
    runs-on: ubuntu-latest
    # Observed 90-114s per shard. 7 min keeps the worst case (2 + 7) under budget.
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/sut-up.sh
      # Each Playwright invocation writes its own json report, then gets checked immediately —
      # a shared path would let the second run overwrite the first one's evidence.
      - run: npm run test:api
        env: { PW_JSON_REPORT: test-results/api-report.json }
      - run: node scripts/check-flake.mjs test-results/api-report.json
      - run: npm run test:contract
      - run: npx playwright test --grep @smoke --project=chromium --shard=${{ matrix.shard }}
        env: { PW_JSON_REPORT: test-results/ui-report.json }
      - run: node scripts/check-flake.mjs test-results/ui-report.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: traces-${{ strategy.job-index }}
          path: test-results/
          retention-days: 14
